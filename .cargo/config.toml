[env]
# ScreenCaptureKit's Swift bridge needs no back-deployment shims from macOS 14 on.
MACOSX_DEPLOYMENT_TARGET = "14.0"

# The screencapturekit build script only adds Xcode's Swift library path; this covers
# machines that have just the Command Line Tools. Harmless when Xcode is installed.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-L/Library/Developer/CommandLineTools/usr/lib/swift/macosx"]
