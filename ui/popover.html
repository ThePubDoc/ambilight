<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ambilight</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="popover.js"></script>
</head>
<body class="popover">
  <main id="main">
    <header>
      <h1>Ambilight</h1>
      <label class="switch" title="Turn the lights on or off">
        <input type="checkbox" id="enabled" aria-label="Lights on">
        <span></span>
      </label>
    </header>

    <div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
      <div class="hidden" id="permission" style="font-size: 12px; margin: 4px 0 0 14px">
        <button class="link" id="permissionButton">Open Privacy &amp; Security settings</button>
        <div class="secondary" id="permissionHint"></div>
      </div>
    </div>

    <div class="update hidden" id="update">
      <span id="updateText"></span>
      <button class="button" id="installUpdate">Install</button>
    </div>

    <div class="segmented" id="mode" role="radiogroup" aria-label="Mode">
      <button data-mode="screen" title="Follow the screen">Screen</button>
      <button data-mode="screenSound" title="Screen colors, pulsing with the audio">Mix</button>
      <button data-mode="sound" title="Follow the audio">Sound</button>
      <button data-mode="color" title="One color">Color</button>
      <button data-mode="effect" title="Animated effects">Effect</button>
    </div>

    <div class="segmented small hidden" id="effect" role="radiogroup" aria-label="Effect">
      <button data-effect="rainbow">Rainbow</button>
      <button data-effect="spectrum">Spectrum</button>
      <button data-effect="breathing">Breathe</button>
      <button data-effect="candle">Candle</button>
      <button data-effect="aurora">Aurora</button>
    </div>

    <div class="secondary hidden" id="soundProfileCaption" style="font-size: 11.5px; margin: 0 0 -6px 2px">Sound style while following audio, e.g. on Netflix:</div>
    <div class="segmented small grid hidden" id="soundProfile" role="radiogroup" aria-label="Sound style">
      <button data-profile="glow" title="Calm: one color that fades gently with the music (like Hue Sync's Subtle)">Glow</button>
      <button data-profile="breathe" title="Calm: slowly breathes in and out with the song's tempo">Breathe</button>
      <button data-profile="lava" title="Calm: soft blobs of color drift around the screen (LedFx Lava lamp)">Lava</button>
      <button data-profile="waves" title="Calm: slow waves roll up from the bottom (WLED Plasmoid)">Waves</button>
      <button data-profile="pulse" title="One color that follows the loudness, with soft pulses on beats">Pulse</button>
      <button data-profile="energy" title="Bass, mids and treble as red, green and blue bars (LedFx Energy)">Energy</button>
      <button data-profile="scroll" title="The sound's color flows around the screen (LedFx Scroll)">Scroll</button>
      <button data-profile="meter" title="A volume meter up both sides with a falling peak dot (WLED Gravimeter)">Meter</button>
      <button data-profile="spectrum" title="Bass at the bottom to treble at the top (WLED GEQ)">Spectrum</button>
      <button data-profile="ripple" title="Each beat drops a ripple of color (WLED Ripple Peak)">Ripple</button>
      <button data-profile="power" title="Swells with the bass, sparkles on the treble (LedFx Power)">Power</button>
    </div>

    <div class="swatches hidden" id="swatches"></div>

    <div class="slider-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21"/></svg>
      <input type="range" id="brightness" min="5" max="100" aria-label="Brightness">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
    </div>

    <hr>

    <footer>
      <button class="plain" id="settings">Settings…</button>
      <span class="secondary shortcut-hint" id="shortcutHint"></span>
      <button class="plain" id="quit">Quit</button>
    </footer>
  </main>
</body>
</html>
