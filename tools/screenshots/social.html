<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ambilight social preview</title>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #0b0b0f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #f5f5f7; position: relative;
  }
  /* The "strip": a soft multicolor glow around the frame, like light on the wall behind a screen. */
  .glow {
    position: absolute; inset: 40px; border-radius: 28px;
    box-shadow:
      -60px -30px 120px -20px rgba(255, 55, 140, 0.55),
      60px -30px 120px -20px rgba(80, 140, 255, 0.55),
      60px 40px 120px -20px rgba(40, 220, 200, 0.5),
      -60px 40px 120px -20px rgba(255, 150, 40, 0.5);
  }
  .panel {
    position: absolute; inset: 40px; border-radius: 28px; background: #121218;
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; align-items: center; justify-content: space-between; padding: 0 70px;
  }
  .text { max-width: 600px; }
  .title { display: flex; align-items: center; gap: 22px; }
  .title img { width: 96px; height: 96px; }
  h1 { font-size: 76px; font-weight: 700; letter-spacing: -1.5px; margin: 0; }
  p { font-size: 29px; line-height: 1.35; color: #c7c7cc; margin: 26px 0 30px; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    font-size: 20px; padding: 8px 16px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.08); color: #e5e5ea; border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .shot img { width: 400px; border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="panel">
    <div class="text">
      <div class="title"><img src="app-icon.png" alt=""><h1>Ambilight</h1></div>
      <p>Screen-synced LED lighting for your monitor. A tiny menu bar app for macOS and Windows.</p>
      <div class="chips">
        <span class="chip">Screen · Mix · Sound · Effects</span>
        <span class="chip">Beat tracking</span>
        <span class="chip">Works with Netflix</span>
        <span class="chip">Adalight &amp; WLED</span>
        <span class="chip">Open source</span>
      </div>
    </div>
    <div class="shot"><img src="popover-effect-dark.png" alt=""></div>
  </div>
</body>
</html>
